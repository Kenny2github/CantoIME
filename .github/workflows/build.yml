name: Build

# Builds the TSF text service DLLs on a Windows runner, compiles the Inno Setup
# installer, and publishes both as artifacts (DLLs + dictionary, and the
# CantoIME-Setup.exe).
#
# Triggered on push only. A push to a PR's head branch still surfaces this run
# as a check on the PR, so a separate pull_request trigger would just double the
# runs (and burn action minutes) for no added coverage.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Fail loudly if LFS did not materialize the dictionaries (a pointer stub
      # would otherwise build and ship a broken IME).
      - name: Verify dictionaries pulled from LFS
        shell: pwsh
        run: |
          foreach ($f in 'traditional.txt', 'simplified.txt') {
            if ((Get-Content $f -TotalCount 1) -like 'version https://git-lfs.github.com/spec/v1*') {
              throw "$f is still a Git LFS pointer, not the real dictionary."
            }
          }

      - name: Configure (CMake, Visual Studio x64)
        run: cmake -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      # Inno Setup is not preinstalled on windows-latest; Chocolatey is.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\setup.iss'

      # Collect the DLLs, dictionary, and installer into one flat folder so they
      # ship as a single artifact.
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\Release\CantoIME-HK.dll, `
                    build\Release\CantoIME-TW.dll, `
                    build\Release\CantoIME-MO.dll, `
                    build\Release\CantoIME-CN.dll, `
                    build\Release\CantoIME-SG.dll, `
                    build\Release\traditional.txt, `
                    build\Release\simplified.txt, `
                    installer\Output\CantoIME-Setup.exe dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CantoIME-x64
          path: dist/
          if-no-files-found: error
