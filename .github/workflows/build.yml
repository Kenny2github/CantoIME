name: Build

# Builds the TSF text service DLL on a Windows runner for every push and PR,
# and publishes the compiled DLL (plus the sample dictionary) as an artifact.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake, Visual Studio x64)
        run: cmake -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinimalPinyinIME-x64
          path: |
            build/Release/MinimalPinyinIME.dll
            build/Release/dictionary.txt
          if-no-files-found: error
