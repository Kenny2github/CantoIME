name: Build

# Builds the TSF text service DLLs on a Windows runner and publishes them (plus
# the sample dictionary) as an artifact.
#
# Triggered on push only. A push to a PR's head branch still surfaces this run
# as a check on the PR, so a separate pull_request trigger would just double the
# runs (and burn action minutes) for no added coverage.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake, Visual Studio x64)
        run: cmake -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: CantoIME-x64
          path: |
            build/Release/CantoIME-HK.dll
            build/Release/CantoIME-TW.dll
            build/Release/CantoIME-MO.dll
            build/Release/dictionary.txt
          if-no-files-found: error
